<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>esp-eBus Status</title>
    <link rel="stylesheet" href="common.css">
</head>

<body>
    <h1>Status</h1>
    <div class="controls">
        <button id="btnHome">Home</button>
        <button id="btnHealth">Health</button>
        <button id="btnHeap">Heap</button>
        <button id="btnTasks">Tasks</button>
        <button id="btnSystem">System</button>
        <button id="btnNetwork">Network</button>
        <span id="status">...</span>
        <button id="btnRefresh" style="margin-left:auto;">Refresh</button>
    </div>
    <div class="container" id="statusContainer"></div>
    <div class="container" id="heapContainer" style="display:none">
        <h2>heap</h2>
        <div id="heapCurrent"></div>
        <h2>trend (hourly)</h2>
        <table>
            <thead id="heapTableHeader"></thead>
            <tbody id="heapTableBody"></tbody>
        </table>
    </div>
    <div class="container" id="tasksContainer" style="display:none">
        <h2>stacks</h2>
        <table>
            <thead id="threadsTableHeader"></thead>
            <tbody id="threadsTableBody"></tbody>
        </table>
        <h2>cpu share since last poll (%)</h2>
        <table>
            <thead id="cpuTableHeader"></thead>
            <tbody id="cpuTableBody"></tbody>
        </table>
    </div>
    <script src="common.js"></script>
    <script>
        let currentView = 'health';
        const viewLoaders = { health: loadHealth, system: loadSystem, network: loadNetwork, heap: loadHeap, tasks: loadTasks };
        function loadHealth() {
            currentView = 'health';
            showView('statusContainer');
            fetchJson('/api/v1/health', data => {
                renderSummaryTable(data, 'statusContainer');
            }, 'Checking health...');
        }
        function loadSystem() {
            currentView = 'system';
            showView('statusContainer');
            fetchJson('/api/v1/system', data => {
                renderTables(data, 'statusContainer');
            }, 'Loading System...');
        }
        function loadNetwork() {
            currentView = 'network';
            showView('statusContainer');
            fetchJson('/api/v1/network', data => {
                renderTables(data, 'statusContainer');
            }, 'Loading Network...');
        }
        function loadHeap() {
            currentView = 'heap';
            showView('heapContainer');
            fetchJson('/api/v1/system/heap', data => {
                const cur = data.current || {};
                document.getElementById('heapCurrent').textContent =
                    `free: ${cur.free} / largest: ${cur.largest} / min: ${cur.min}`;
                const trend = data.trend || [];
                const cols = ['uptime', 'free', 'min', 'largest'];
                renderRows('heapTableHeader', 'heapTableBody', cols, trend);
            }, 'Loading Heap...');
        }
        function loadTasks() {
            currentView = 'tasks';
            showView('tasksContainer');
            fetchJson('/api/v1/system/tasks', data => {
                renderRows('threadsTableHeader', 'threadsTableBody',
                    ['name', 'stack_size', 'stack_free'], data.threads || []);
                renderRows('cpuTableHeader', 'cpuTableBody',
                    ['name', 'pct', 'prio'], data.cpu || []);
            }, 'Loading Tasks...');
        }
        function showView(id) {
            for (const v of ['statusContainer', 'heapContainer', 'tasksContainer']) {
                document.getElementById(v).style.display = v === id ? '' : 'none';
            }
        }
        document.getElementById('btnHome').addEventListener('click', handleHome);
        document.getElementById('btnHealth').addEventListener('click', loadHealth);
        document.getElementById('btnHeap').addEventListener('click', loadHeap);
        document.getElementById('btnTasks').addEventListener('click', loadTasks);
        document.getElementById('btnSystem').addEventListener('click', loadSystem);
        document.getElementById('btnNetwork').addEventListener('click', loadNetwork);
        document.getElementById('btnRefresh').addEventListener('click', () => {
            // Refresh reloads the currently visible view, not always health.
            (viewLoaders[currentView] || loadHealth)();
        });

        // Probe endpoints once to hide unavailable buttons (internal-only
        // clusters 404 on bridge builds). No data is fetched until a button
        // is actually clicked.
        async function initButtons() {
            const views = [
                { btn: 'btnHealth', path: '/api/v1/health', load: loadHealth },
                { btn: 'btnHeap', path: '/api/v1/system/heap', load: loadHeap },
                { btn: 'btnTasks', path: '/api/v1/system/tasks', load: loadTasks },
                { btn: 'btnSystem', path: '/api/v1/system', load: loadSystem },
                { btn: 'btnNetwork', path: '/api/v1/network', load: loadNetwork },
            ];
            let first = null;
            for (const v of views) {
                try {
                    const res = await fetch(v.path);
                    if (!res.ok) throw new Error('unavailable');
                    if (!first) first = v;
                } catch (err) {
                    const el = document.getElementById(v.btn);
                    if (el) el.style.display = 'none';
                }
            }
            // Initial load: health summary if served, else first available.
            (first ? first.load : () => setStatus('No data endpoints'))();
        }

        // Initial load: button availability probe (+ first view)
        initButtons();
    </script>
</body>

</html>
